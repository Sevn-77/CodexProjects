name: Creator OS tests

on:
  push:
    paths:
      - 'Creator-OS/**'
      - '.github/workflows/creator-os-tests.yml'
  pull_request:
    paths:
      - 'Creator-OS/**'
      - '.github/workflows/creator-os-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run Creator OS tests
        run: node --test Creator-OS/tests/creator-os.test.cjs
